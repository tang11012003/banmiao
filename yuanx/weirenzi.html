<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>家长认证 - 陪读社区</title>
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--primary:#E6431A;--secondary:#F24B0A;--bg:#F5F5F7;--surface:#FFFFFF;--text1:#1A1A1A;--text2:#424242;--text3:#616161;--hint:#9E9E9E;--divider:#EAEAEA;--urgent:#E53935;--keep:#43A047;--orange:#FF6D00;--r-card:14px;--r-btn:10px}
body{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;background:#e8e8e8;color:var(--text1);font-size:14px;line-height:1.5;overflow:hidden;height:100vh;display:flex;align-items:center;justify-content:center}
#app{width:100%;max-width:390px;height:100vh;max-height:844px;background:var(--bg);position:relative;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 0 40px rgba(0,0,0,.15)}
@media(max-width:420px){#app{max-height:100vh;box-shadow:none}}
.app-bar{background:var(--surface);height:52px;display:flex;align-items:center;padding:0 12px;box-shadow:0 .5px 2px rgba(0,0,0,.08);flex-shrink:0;z-index:10}
.app-bar .back-btn{width:36px;height:36px;display:flex;align-items:center;justify-content:center;cursor:pointer;border-radius:50%;border:none;background:none;color:var(--text2)}
.app-bar .back-btn:active{background:#f0f0f0}
.app-bar .title{font-size:17px;font-weight:600;color:var(--text1);flex:1;margin-left:4px}
.page-body{flex:1;overflow-y:auto;padding:16px;-webkit-overflow-scrolling:touch}
.section-heading{font-size:16px;font-weight:700;color:var(--text1);margin-bottom:12px}
.radio-list{background:var(--surface);border-radius:var(--r-card);overflow:hidden;margin-bottom:16px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.radio-item{display:flex;align-items:center;padding:14px 16px;border-bottom:1px solid var(--divider);cursor:pointer;transition:background .12s}
.radio-item:last-child{border-bottom:none}
.radio-item:active{background:#fafafa}
.radio-item .radio-circle{width:20px;height:20px;border-radius:50%;border:2px solid var(--hint);margin-right:12px;flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:all .15s}
.radio-item.active .radio-circle{border-color:var(--primary)}
.radio-item.active .radio-circle::after{content:'';width:10px;height:10px;border-radius:50%;background:var(--primary)}
.radio-item .radio-label{font-size:14px;color:var(--text1);font-weight:500}
.method-content{background:var(--surface);border-radius:var(--r-card);padding:16px;margin-bottom:16px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.upload-area{display:flex;align-items:center;gap:12px;padding:16px;border:1.5px dashed #ccc;border-radius:10px;cursor:pointer;transition:border-color .15s}
.upload-area:active{border-color:var(--primary)}
.upload-area .material-icons{font-size:28px;color:var(--hint)}
.upload-area .upload-text{flex:1}
.upload-area .upload-text .ut-title{font-size:14px;font-weight:500;color:var(--text1)}
.upload-area .upload-text .ut-sub{font-size:12px;color:var(--text3);margin-top:2px}
.invite-input{width:100%;padding:12px 14px;border:1px solid var(--divider);border-radius:10px;font-size:15px;letter-spacing:2px;outline:none;font-weight:600;background:#fafafa;transition:border-color .2s}
.invite-input:focus{border-color:var(--primary)}
.invite-input::placeholder{font-weight:400;letter-spacing:0}
.submit-btn{width:100%;padding:14px;border-radius:var(--r-btn);border:none;background:var(--primary);color:#fff;font-size:16px;font-weight:500;cursor:pointer;transition:all .15s}
.submit-btn:active{transform:scale(.97)}
.submit-btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
.status-banner{display:flex;align-items:center;gap:10px;padding:14px 16px;border-radius:var(--r-card);margin-top:16px}
.status-banner .material-icons{font-size:22px;flex-shrink:0}
.status-banner .sb-text{font-size:13px;line-height:1.5}
.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.78);color:#fff;padding:9px 20px;border-radius:20px;font-size:13px;z-index:3000;display:none;white-space:nowrap}
</style>
</head>
<body>
<div id="app">
<div class="app-bar">
<button class="back-btn" onclick="history.back()"><span class="material-icons">arrow_back</span></button>
<span class="title">家长认证</span>
</div>
<div class="page-body" id="pageBody"></div>
</div>
<div class="toast" id="toast"></div>
<script>
const methods=[
{value:'studentCard',label:'学生证'},
{value:'classGroup',label:'班级群截图'},
{value:'paymentReceipt',label:'缴费凭证'}

];

let selectedMethod='inviteCode';
let submitting=false;
let verificationStatus=null; // null | 'pending' | 'approved' | 'rejected'

function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.style.display='block';setTimeout(()=>t.style.display='none',2000)}

function render(){
const isInvite=selectedMethod==='inviteCode';

let methodContent='';
if(isInvite){
methodContent=`
<div class="method-content">
<div style="font-size:13px;color:var(--text3);margin-bottom:10px">输入已认证家长分享的邀请码</div>
<input class="invite-input" id="inviteInput" maxlength="10" placeholder="请输入邀请码" autocomplete="off">
</div>`;
}else{
const labels={'studentCard':'学生证照片','classGroup':'班级群截图','paymentReceipt':'缴费凭证截图'};
methodContent=`
<div class="method-content">
<div class="upload-area" onclick="showToast('选择图片上传（演示）')">
<span class="material-icons">photo_camera</span>
<div class="upload-text">
<div class="ut-title">上传${labels[selectedMethod]||'材料截图'}</div>
<div class="ut-sub">点击拍照或从相册选择</div>
</div>
<span class="material-icons" style="color:var(--hint);font-size:20px">chevron_right</span>
</div>
</div>`;
}

let statusHtml='';
if(verificationStatus==='pending'){
statusHtml=`<div class="status-banner" style="background:rgba(255,152,0,.1)"><span class="material-icons" style="color:#FF9800">info</span><div class="sb-text" style="color:#E65100">审核中，请耐心等待（预计≤30分钟）</div></div>`;
}else if(verificationStatus==='approved'){
statusHtml=`<div class="status-banner" style="background:rgba(67,160,71,.1)"><span class="material-icons" style="color:var(--keep)">check_circle</span><div class="sb-text" style="color:#2E7D32">已通过认证，已解锁全部功能</div></div>`;
}else if(verificationStatus==='rejected'){
statusHtml=`<div class="status-banner" style="background:rgba(229,57,53,.08)"><span class="material-icons" style="color:var(--urgent)">cancel</span><div class="sb-text" style="color:#C62828">认证被驳回：材料不清晰，请重新提交</div></div>`;
}

document.getElementById('pageBody').innerHTML=`
<div class="section-heading">请选择一种方式完成家长身份确认</div>
<div class="radio-list">
${methods.map(m=>`
<div class="radio-item${m.value===selectedMethod?' active':''}" onclick="selectMethod('${m.value}')">
<div class="radio-circle"></div>
<span class="radio-label">${m.label}</span>
</div>`).join('')}
</div>
${methodContent}
<button class="submit-btn" id="submitBtn" onclick="doSubmit()"${submitting?' disabled':''}>${submitting?'提交中…':'提交认证'}</button>
${statusHtml}
`;
}

function selectMethod(val){
selectedMethod=val;
render();
}

function doSubmit(){
const isInvite=selectedMethod==='inviteCode';
if(isInvite){
const input=document.getElementById('inviteInput');
const code=input?input.value.trim():'';
if(!code){showToast('请输入邀请码');return}
submitting=true;
render();
setTimeout(()=>{
submitting=false;
if(code.toUpperCase()==='PAIDU8'||code.length>=4){
verificationStatus='approved';
showToast('邀请码认证成功，已解锁全部功能');
render();
setTimeout(()=>{window.location.href='wode.html'},1500);
}else{
verificationStatus=null;
showToast('邀请码无效，请重新输入');
render();
}
},1000);
}else{
submitting=true;
render();
setTimeout(()=>{
submitting=false;
verificationStatus='pending';
showToast('已提交，审核中（预计≤30分钟）');
render();
},1000);
}
}

render();
</script>
</body>
</html>
