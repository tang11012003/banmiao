<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>深度分析中 - 陪读社区</title>
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--primary:#E6431A;--secondary:#F24B0A;--bg:#F5F5F7;--surface:#FFFFFF;--text1:#1A1A1A;--text2:#424242;--text3:#616161;--hint:#9E9E9E;--divider:#EAEAEA;--urgent:#E53935;--attention:#FBC02D;--keep:#43A047;--orange:#FF6D00;--r-card:14px;--r-btn:10px}
body{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;background:#e8e8e8;color:var(--text1);font-size:14px;line-height:1.5;overflow:hidden;height:100vh;display:flex;align-items:center;justify-content:center}
#app{width:100%;max-width:390px;height:100vh;max-height:844px;background:var(--bg);position:relative;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 0 40px rgba(0,0,0,.15)}
@media(max-width:420px){#app{max-height:100vh;box-shadow:none}}
.app-bar{background:var(--surface);height:52px;display:flex;align-items:center;padding:0 12px;box-shadow:0 .5px 2px rgba(0,0,0,.08);flex-shrink:0;z-index:10}
.app-bar .back-btn{width:36px;height:36px;display:flex;align-items:center;justify-content:center;cursor:pointer;border-radius:50%;border:none;background:none;color:var(--text2)}
.app-bar .back-btn:active{background:#f0f0f0}
.app-bar .title{font-size:17px;font-weight:600;color:var(--text1);flex:1;margin-left:4px}

.page-body{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center}

/* Loading animation */
.loader-ring{width:80px;height:80px;position:relative;margin-bottom:24px}
.loader-ring::after{content:'';display:block;width:64px;height:64px;margin:8px;border-radius:50%;border:4px solid transparent;border-top-color:var(--primary);border-right-color:rgba(230,67,26,.3);animation:spin 1.2s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loader-icon{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.loader-icon .material-icons{font-size:28px;color:var(--primary);animation:pulse 2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}

.loading-title{font-size:18px;font-weight:700;color:var(--text1);margin-bottom:8px}
.loading-step{font-size:14px;color:var(--primary);font-weight:600;margin-bottom:6px;min-height:20px;transition:opacity .3s}
.loading-sub{font-size:12px;color:var(--text3);margin-bottom:24px}

/* Progress bar */
.progress-wrap{width:100%;max-width:260px;margin-bottom:32px}
.progress-track{height:6px;background:#eee;border-radius:3px;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--primary),var(--orange));border-radius:3px;transition:width .4s ease}
.progress-label{display:flex;justify-content:space-between;margin-top:6px;font-size:11px;color:var(--hint)}

/* Action buttons */
.action-group{width:100%;max-width:280px;display:flex;flex-direction:column;gap:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:12px 20px;border-radius:var(--r-btn);font-size:14px;font-weight:600;cursor:pointer;border:none;transition:all .15s;width:100%}
.btn:active{transform:scale(.97)}
.btn-primary{background:var(--primary);color:#fff}
.btn-outline{background:#fff;color:var(--primary);border:1.5px solid rgba(230,67,26,.3)}
.btn-ghost{background:none;color:var(--text3);border:none;font-weight:500}

/* Completion state */
.done-icon{width:64px;height:64px;border-radius:50%;background:rgba(67,160,71,.1);display:flex;align-items:center;justify-content:center;margin-bottom:16px}
.done-icon .material-icons{font-size:32px;color:var(--keep)}

/* ── PRD 标注系统 ── */
.prd-mark{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:50%;background:#1565C0;color:#fff;font-size:11px;font-weight:700;cursor:pointer;flex-shrink:0;transition:transform .12s;user-select:none;vertical-align:middle;margin-left:6px;box-shadow:0 2px 6px rgba(21,101,194,.4);position:relative;z-index:5}
.prd-mark:active{transform:scale(.85)}
.prd-overlay{position:fixed;inset:0;z-index:900;background:transparent}
.prd-popover{position:fixed;z-index:910;background:#fff;border-radius:14px;box-shadow:0 8px 32px rgba(0,0,0,.18);width:290px;padding:0;overflow:hidden}
.prd-popover-arrow{position:absolute;width:12px;height:12px;background:#fff;transform:rotate(45deg);box-shadow:-2px -2px 5px rgba(0,0,0,.06)}
.prd-pop-head{padding:14px 16px 10px;border-bottom:1px solid #f0f0f0}
.prd-pop-title{font-size:13px;font-weight:700;color:#1A1A1A;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.prd-pop-badge{font-size:10px;padding:2px 7px;border-radius:8px;font-weight:600;background:#FDE8E8;color:#C62828}
.prd-pop-badge.interaction{background:#E8F5E9;color:#2E7D32}
.prd-pop-badge.data{background:#E3F2FD;color:#1565C0}
.prd-pop-body{padding:12px 16px}
.prd-pop-body textarea{width:100%;min-height:110px;border:1px solid #e0e0e0;border-radius:8px;padding:9px 10px;font-size:12px;line-height:1.6;color:#424242;font-family:-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif;resize:vertical;outline:none;background:#fafafa;transition:border .15s}
.prd-pop-body textarea:focus{border-color:#1565C0;background:#fff}
.prd-pop-foot{padding:10px 16px 14px;display:flex;gap:8px;justify-content:flex-end}
.prd-pop-foot button{padding:7px 16px;border-radius:8px;font-size:13px;font-weight:500;cursor:pointer;border:none}
.prd-btn-cancel{background:#f5f5f5;color:#424242}
.prd-btn-save{background:#1565C0;color:#fff}
</style>
</head>
<body>
<div id="app">
<div class="app-bar">
<button class="back-btn" onclick="history.back()"><span class="material-icons">arrow_back</span></button>
<span class="title">AI 深度分析</span>
</div>
<div class="page-body" id="pageBody"></div>
</div>

<script>
const steps = [
  '正在提取错题知识点...',
  '正在匹配考纲知识图谱...',
  '正在进行跨学科关联分析...',
  '正在生成提分建议...',
  '正在合成诊断报告...'
];

let currentStep = 0;
let progress = 0;
let completed = false;
let bgMode = false;

const taskInfo = JSON.parse(localStorage.getItem('reportTask') || 'null');
const examName = taskInfo ? taskInfo.examName : '数学期中考试';
const subject = taskInfo ? taskInfo.subject : '数学';

function renderLoading() {
  document.getElementById('pageBody').innerHTML = `
    <div class="loader-ring">
      <div class="loader-icon"><span class="material-icons">psychology</span></div>
    </div>
    <div class="loading-title">${subject} · ${examName}</div>
    <div class="loading-step" id="stepText">${steps[0]}</div>
    <div class="loading-sub">AI 正在深度分析您的试卷，预计需要 10~30 秒</div>
    <span class="prd-mark" style="position:fixed;top:68px;right:20px;z-index:50" onclick="openPrd(event,1)">1</span><div class="progress-wrap">
      <div class="progress-track"><div class="progress-fill" id="progressBar" style="width:0%"></div></div>
      <div class="progress-label"><span id="progressPct">0%</span><span>预计剩余 ~20s</span></div>
    </div>
    <span class="prd-mark" style="position:fixed;top:68px;right:48px;z-index:50" onclick="openPrd(event,2)">2</span><div class="action-group">
      <button class="btn btn-outline" onclick="goUploadMore()">
        <span class="material-icons" style="font-size:18px">add_a_photo</span>继续上传其它科目
      </button>
      <button class="btn btn-ghost" onclick="goHome()">
        <span class="material-icons" style="font-size:16px">home</span>稍后查看，返回首页
      </button>
    </div>
  `;
  startProgress();
}

function renderComplete() {
  document.getElementById('pageBody').innerHTML = `
    <div class="done-icon"><span class="material-icons">check_circle</span></div>
    <div class="loading-title">诊断报告已生成</div>
    <div style="font-size:13px;color:var(--text3);margin-bottom:24px">${subject} · ${examName}</div>
    <span class="prd-mark" style="position:fixed;top:68px;right:48px;z-index:50" onclick="openPrd(event,2)">2</span><div class="action-group">
      <button class="btn btn-primary" onclick="viewReport()">
        <span class="material-icons" style="font-size:18px">description</span>查看诊断报告
      </button>
      <button class="btn btn-outline" onclick="goUploadMore()">
        <span class="material-icons" style="font-size:18px">add_a_photo</span>继续上传其它科目
      </button>
      <button class="btn btn-ghost" onclick="goHome()">返回首页</button>
    </div>
  `;
}

function startProgress() {
  const interval = setInterval(() => {
    if (bgMode) { clearInterval(interval); return; }
    progress += Math.random() * 8 + 4;
    if (progress >= 100) progress = 100;

    const stepIdx = Math.min(Math.floor(progress / 20), steps.length - 1);
    if (stepIdx !== currentStep) {
      currentStep = stepIdx;
      const el = document.getElementById('stepText');
      if (el) el.textContent = steps[currentStep];
    }

    const bar = document.getElementById('progressBar');
    const pct = document.getElementById('progressPct');
    if (bar) bar.style.width = progress + '%';
    if (pct) pct.textContent = Math.round(progress) + '%';

    if (progress >= 100) {
      clearInterval(interval);
      completed = true;
      updateTaskState('completed');
      setTimeout(() => renderComplete(), 600);
    }
  }, 500);
}

function goUploadMore() {
  setBgMode();
  window.location.href = 'xuanzhexingzhi.html';
}

function goHome() {
  setBgMode();
  window.location.href = 'fenxi.html';
}

function viewReport() {
  updateTaskState('read');
  window.location.href = 'fenxibaogao.html';
}

function setBgMode() {
  bgMode = true;
  if (!completed) {
    updateTaskState('generating');
  }
}

function updateTaskState(status) {
  const task = JSON.parse(localStorage.getItem('reportTask') || '{}');
  task.status = status;
  task.updatedAt = Date.now();
  localStorage.setItem('reportTask', JSON.stringify(task));
}

// Check if returning to a completed task
if (taskInfo && taskInfo.status === 'completed') {
  completed = true;
  renderComplete();
} else {
  renderLoading();
}

function showToast(msg){const t=document.createElement('div');t.style.cssText='position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.78);color:#fff;padding:9px 20px;border-radius:20px;font-size:13px;z-index:3000;white-space:nowrap';t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),2000)}

</script>
<script src="prd-runtime.js"></script>
</body>
</html>
