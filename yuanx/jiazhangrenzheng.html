<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>家长认证 - 陪读社区</title>
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--primary:#E6431A;--secondary:#F24B0A;--bg:#F5F5F7;--surface:#FFFFFF;--text1:#1A1A1A;--text2:#424242;--text3:#616161;--hint:#9E9E9E;--divider:#EAEAEA;--urgent:#E53935;--keep:#43A047;--attention:#FF9800;--r-card:14px;--r-btn:10px}
body{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;background:#e8e8e8;color:var(--text1);font-size:14px;line-height:1.5;overflow:hidden;height:100vh;display:flex;align-items:center;justify-content:center}
#app{width:100%;max-width:390px;height:100vh;max-height:844px;background:var(--bg);position:relative;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 0 40px rgba(0,0,0,.15)}
@media(max-width:420px){#app{max-height:100vh;box-shadow:none}}
.app-bar{background:var(--surface);height:52px;display:flex;align-items:center;padding:0 12px;box-shadow:0 .5px 2px rgba(0,0,0,.08);flex-shrink:0;z-index:10}
.app-bar .back-btn{width:36px;height:36px;display:flex;align-items:center;justify-content:center;cursor:pointer;border-radius:50%;border:none;background:none;color:var(--text2)}
.app-bar .back-btn:active{background:#f0f0f0}
.app-bar .title{font-size:17px;font-weight:600;color:var(--text1);flex:1;margin-left:4px}
.page-body{flex:1;overflow-y:auto;padding:16px;-webkit-overflow-scrolling:touch}
.section-label{font-size:16px;font-weight:700;color:var(--text1);margin-bottom:4px}
.section-desc{font-size:13px;color:var(--text3);margin-bottom:16px}
.radio-item{display:flex;align-items:center;gap:12px;padding:14px 12px;background:var(--surface);border-radius:10px;margin-bottom:8px;cursor:pointer;border:1.5px solid transparent;transition:all .12s}
.radio-item:active{background:#fafafa}
.radio-item.selected{border-color:var(--primary);background:rgba(230,67,26,.03)}
.radio-dot{width:20px;height:20px;border-radius:50%;border:2px solid var(--hint);flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:all .12s}
.radio-item.selected .radio-dot{border-color:var(--primary)}
.radio-dot-inner{width:10px;height:10px;border-radius:50%;background:var(--primary);transform:scale(0);transition:transform .12s}
.radio-item.selected .radio-dot-inner{transform:scale(1)}
.radio-label{font-size:14px;color:var(--text1);font-weight:500}
.form-area{margin-top:12px;background:var(--surface);border-radius:10px;padding:16px;margin-bottom:12px}
.input-field{width:100%;padding:12px 14px;border:1.5px solid var(--divider);border-radius:8px;font-size:15px;outline:none;background:#fafafa;letter-spacing:1px;font-weight:600;text-transform:uppercase;transition:border .2s}
.input-field:focus{border-color:var(--primary)}
.input-label{font-size:13px;color:var(--text3);margin-bottom:6px;font-weight:500}
.upload-card{display:flex;align-items:center;gap:12px;padding:14px;background:#fafafa;border-radius:10px;border:1.5px dashed var(--divider);cursor:pointer;transition:all .12s}
.upload-card:active{background:#f0f0f0}
.upload-card.done{border-color:var(--keep);border-style:solid;background:rgba(67,160,71,.04)}
.upload-card .material-icons{font-size:28px;color:var(--hint)}
.upload-card.done .material-icons{color:var(--keep)}
.upload-card .uc-text{flex:1}
.upload-card .uc-title{font-size:14px;color:var(--text1);font-weight:500}
.upload-card .uc-sub{font-size:12px;color:var(--text3);margin-top:2px}
.submit-btn{width:100%;padding:14px;border-radius:var(--r-btn);border:none;background:var(--primary);color:#fff;font-size:15px;font-weight:600;cursor:pointer;margin-top:16px;transition:all .12s}
.submit-btn:active{transform:scale(.98);opacity:.9}
.submit-btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
.status-banner{display:flex;align-items:center;gap:10px;padding:14px 16px;border-radius:10px;margin-top:16px}
.status-banner .material-icons{font-size:22px}
.status-banner .sb-text{font-size:14px;font-weight:500}
.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.78);color:#fff;padding:9px 20px;border-radius:20px;font-size:13px;z-index:3000;display:none;white-space:nowrap}
</style>
</head>
<body>
<div id="app">
<div class="app-bar">
<button class="back-btn" onclick="history.back()"><span class="material-icons">arrow_back</span></button>
<span class="title">家长认证</span>
</div>
<div class="page-body" id="pageBody"></div>
</div>
<div class="toast" id="toast"></div>
<script>
let method='student_card';
let submitting=false;
let uploadDone=false;
let verificationStatus='approved';
let reviewNote='';

const options=[
  {value:'student_card', label:'学生证 / 校园卡'},
  {value:'class_group', label:'班级群截图'},
  {value:'payment', label:'缴费凭证'}
];

function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.style.display='block';setTimeout(()=>t.style.display='none',2200)}

function isInvite(){return method==='invite_code'}

function render(){
const pb=document.getElementById('pageBody');
let html='';

html+=`<div class="section-label">选择认证方式</div>`;
html+=`<div class="section-desc">完成家长身份认证后即可使用全部功能</div>`;

options.forEach(opt=>{
  const sel=method===opt.value?'selected':'';
  html+=`<div class="radio-item ${sel}" onclick="selectMethod('${opt.value}')">
    <div class="radio-dot"><div class="radio-dot-inner"></div></div>
    <span class="radio-label">${opt.label}</span>
  </div>`;
});

if(isInvite()){
  html+=`<div class="form-area">
    <div class="upload-card${uploadDone?' done':''}" onclick="doUpload()">
      <span class="material-icons">${uploadDone?'check_circle':'photo_camera'}</span>
      <div class="uc-text">
        <div class="uc-title">${uploadDone?'已选择图片':'上传材料截图'}</div>
        <div class="uc-sub">${uploadDone?'点击可重新选择':'点击拍照或从相册选取'}</div>
      </div>
    </div>
  </div>`;
}

html+=`<button class="submit-btn" id="submitBtn" onclick="doSubmit()"${submitting?' disabled':''}>${submitting?'提交中…':'提交认证'}</button>`;

if(verificationStatus){
  let color,icon,text;
  if(verificationStatus==='approved'){
    color='var(--keep)'; icon='check_circle'; text='已通过认证';
  }else if(verificationStatus==='pending'){
    color='var(--attention)'; icon='hourglass_top'; text='审核中，请耐心等待';
  }else{
    color='var(--urgent)'; icon='cancel'; text='认证被驳回：'+(reviewNote||'材料不清晰');
  }
  html+=`<div class="status-banner" style="background:${color}1F">
    <span class="material-icons" style="color:${color}">${icon}</span>
    <span class="sb-text" style="color:${color}">${text}</span>
  </div>`;
}

pb.innerHTML=html;
}

function selectMethod(val){
  method=val;
  uploadDone=false;
  render();
}

function doUpload(){
  uploadDone=true;
  render();
}

function doSubmit(){
  if(submitting)return;
  if(isInvite()){
    const code=document.getElementById('codeInput').value.trim().toUpperCase();
    if(!code){showToast('请输入邀请码');return}
    if(code.length<4){showToast('邀请码格式不正确');return}
    submitting=true;
    render();
    setTimeout(()=>{
      submitting=false;
      if(code==='PAIDU8'||code.length>=4){
        verificationStatus='approved';
        showToast('邀请码认证成功，已解锁全部功能');
      }else{
        showToast('邀请码无效');
      }
      render();
    },800);
  }else{
    if(!uploadDone){showToast('请先上传材料截图');return}
    submitting=true;
    render();
    setTimeout(()=>{
      submitting=false;
      verificationStatus='pending';
      showToast('已提交，审核中（预计≤30分钟）');
      render();
    },1000);
  }
}

render();
</script>
</body>
</html>
