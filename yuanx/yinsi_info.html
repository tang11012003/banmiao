<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>个人信息收集清单 - 陪读社区</title>
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
<style>*{margin:0;padding:0;box-sizing:border-box}
:root{--primary:#E6431A;--bg:#F5F5F7;--surface:#FFFFFF;--text1:#1A1A1A;--text2:#424242;--text3:#757575;--hint:#9E9E9E;--divider:#EEEEEE;--r-card:14px}
body{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;background:#e8e8e8;color:var(--text1);font-size:14px;overflow:hidden;height:100vh;display:flex;align-items:center;justify-content:center}
#app{width:100%;max-width:390px;height:100vh;max-height:844px;background:var(--bg);display:flex;flex-direction:column;box-shadow:0 0 40px rgba(0,0,0,.15);overflow:hidden}
@media(max-width:420px){#app{max-height:100vh;box-shadow:none}}
.app-bar{background:var(--surface);height:52px;display:flex;align-items:center;padding:0 12px;border-bottom:1px solid rgba(0,0,0,.05);flex-shrink:0}
.back-btn{width:36px;height:36px;display:flex;align-items:center;justify-content:center;cursor:pointer;border-radius:50%;border:none;background:none;color:var(--text1)}
.back-btn:active{background:#f0f0f0}
.bar-title{font-size:17px;font-weight:600;flex:1;text-align:center;margin-right:36px}
.page-body{flex:1;overflow-y:auto;padding:14px 16px;-webkit-overflow-scrolling:touch}
.card{background:var(--surface);border-radius:var(--r-card);margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.04);overflow:hidden}
.row{display:flex;padding:12px 16px;border-bottom:1px solid var(--divider);gap:8px;align-items:flex-start}
.row:last-child{border-bottom:none}
.row-label{font-size:13px;font-weight:600;color:var(--text1);width:88px;flex-shrink:0;padding-top:1px}
.row-val{flex:1;font-size:13px;color:var(--text2);line-height:1.6}
.section-title{font-size:12px;color:var(--hint);padding:14px 16px 6px;font-weight:500}
.prose{background:var(--surface);border-radius:var(--r-card);padding:16px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.prose h3{font-size:14px;font-weight:700;color:var(--text1);margin:14px 0 6px}
.prose h3:first-child{margin-top:0}
.prose p{font-size:13px;color:var(--text2);line-height:1.8;margin-bottom:8px}
.prose p:last-child{margin-bottom:0}
.update-date{font-size:12px;color:var(--hint);padding:0 16px 14px}</style>
</head>
<body>
<div id="app">
  <div class="app-bar">
    <button class="back-btn" onclick="history.back()"><span class="material-icons">arrow_back</span></button>
    <span class="bar-title">个人信息收集清单</span>
  </div>
  <div class="page-body">
    <div class="update-date">更新日期：2026年7月1日</div>
    <div class="section-title">基本账号信息</div>
    <div class="card">
      <div class="row"><div class="row-label">手机号码</div><div class="row-val">用于注册登录、找回账号，属于必要信息</div></div>
      <div class="row"><div class="row-label">家长昵称</div><div class="row-val">用于社区展示，可修改</div></div>
      <div class="row"><div class="row-label">头像</div><div class="row-val">用于社区展示，可修改</div></div>
    </div>
    <div class="section-title">孩子学情信息</div>
    <div class="card">
      <div class="row"><div class="row-label">孩子姓名</div><div class="row-val">用于个人中心展示，仅本人可见</div></div>
      <div class="row"><div class="row-label">年级</div><div class="row-val">用于学情分析和内容推荐</div></div>
      <div class="row"><div class="row-label">学校名称</div><div class="row-val">可选填，用于精准内容推荐，不对外展示</div></div>
      <div class="row"><div class="row-label">学习科目</div><div class="row-val">用于错题分析和报告生成</div></div>
      <div class="row"><div class="row-label">试卷与错题</div><div class="row-val">用于生成学情分析报告，存储于本地及加密云端</div></div>
    </div>
    <div class="section-title">设备与日志信息</div>
    <div class="card">
      <div class="row"><div class="row-label">设备型号</div><div class="row-val">用于故障排查和兼容性优化</div></div>
      <div class="row"><div class="row-label">操作系统</div><div class="row-val">用于故障排查和兼容性优化</div></div>
      <div class="row"><div class="row-label">操作日志</div><div class="row-val">用于安全审计和产品优化，保留90天后自动删除</div></div>
    </div>
  </div>
</div>
<script src="prd-runtime.js"></script>
</body>
</html>
