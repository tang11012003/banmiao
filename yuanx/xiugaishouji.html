<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>更换手机号 - 陪读社区</title>
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --primary:#E6431A;
  --secondary:#F24B0A;
  --bg:#F5F5F7;
  --surface:#FFFFFF;
  --text1:#1A1A1A;
  --text2:#424242;
  --text3:#757575;
  --hint:#9E9E9E;
  --divider:#EEEEEE;
  --keep:#43A047;
  --r-card:16px;
  --r-btn:12px
}
body{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;background:#e8e8e8;color:var(--text1);font-size:14px;line-height:1.5;overflow:hidden;height:100vh;display:flex;align-items:center;justify-content:center}
#app{width:100%;max-width:390px;height:100vh;max-height:844px;background:var(--bg);position:relative;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 0 40px rgba(0,0,0,.15)}
@media(max-width:420px){#app{max-height:100vh;box-shadow:none}}

/* Header */
.app-bar{background:var(--surface);height:52px;display:flex;align-items:center;padding:0 12px;border-bottom:1px solid rgba(0,0,0,.05);flex-shrink:0;z-index:10}
.app-bar .back-btn{width:36px;height:36px;display:flex;align-items:center;justify-content:center;cursor:pointer;border-radius:50%;border:none;background:none;color:var(--text1);flex-shrink:0}
.app-bar .back-btn:active{background:#f0f0f0}
.app-bar .title{font-size:17px;font-weight:600;color:var(--text1);flex:1;text-align:center;margin-right:36px}

.page-body{flex:1;overflow-y:auto;padding:20px 16px;-webkit-overflow-scrolling:touch}

/* Step Indicator */
.step-container{background:var(--surface);border-radius:var(--r-card);padding:18px 20px;margin-bottom:16px;box-shadow:0 2px 8px rgba(0,0,0,.02)}
.step-indicator{display:flex;align-items:center;justify-content:between}
.step-col{display:flex;flex-direction:column;align-items:center;gap:6px;flex:1}
.step-dot{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;transition:all .3s}
.step-dot.active{background:var(--primary);color:#fff;box-shadow:0 2px 6px rgba(230,67,26,.3)}
.step-dot.done{background:var(--keep);color:#fff}
.step-dot.pending{background:#E0E0E0;color:#fff}
.step-label{font-size:12px;font-weight:500;transition:color .3s}
.step-line{width:60px;height:2px;background:#E0E0E0;margin-top:-18px;transition:background .3s}
.step-line.done{background:var(--keep)}

/* Card & Form */
.card{background:var(--surface);border-radius:var(--r-card);padding:20px 16px;box-shadow:0 2px 8px rgba(0,0,0,.02)}
.card-title{font-size:16px;font-weight:700;color:var(--text1);margin-bottom:4px;display:flex;align-items:center;justify-content:space-between}
.card-sub{font-size:13px;color:var(--text3);margin-bottom:20px;line-height:1.4}

/* Current Phone Box */
.phone-display-box{display:flex;align-items:center;justify-content:space-between;background:#F8F9FA;border:1px solid #E9ECEF;border-radius:10px;padding:12px 14px;margin-bottom:16px}
.phone-display-info{display:flex;align-items:center;gap:10px;color:var(--text1);font-weight:600;font-size:15px}
.phone-display-info .material-icons{color:var(--text3);font-size:20px}

/* Inputs */
.input-group{display:flex;flex-direction:column;gap:12px;margin-bottom:20px}
.input-wrapper{position:relative;display:flex;align-items:center;background:#F8F9FA;border:1px solid #E9ECEF;border-radius:10px;padding:0 12px;height:48px;transition:all .2s}
.input-wrapper:focus-within{border-color:var(--primary);background:#fff;box-shadow:0 0 0 3px rgba(230,67,26,.08)}
.input-wrapper input{flex:1;border:none;background:transparent;outline:none;font-size:15px;color:var(--text1);font-family:inherit;width:100%}
.input-wrapper input::placeholder{color:var(--hint)}

.clear-btn{border:none;background:none;color:var(--hint);cursor:pointer;display:none;padding:4px}
.input-wrapper input:not(:placeholder-shown) + .clear-btn{display:block}

.code-row{display:flex;gap:10px}
.code-row .input-wrapper{flex:1}
.send-btn{height:48px;padding:0 16px;border-radius:10px;border:none;background:var(--primary);color:#fff;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap;flex-shrink:0;transition:all .2s;min-width:108px}
.send-btn:disabled{background:#E0E0E0;color:#9E9E9E;cursor:not-allowed}
.send-btn:not(:disabled):active{opacity:.85}

.next-btn{width:100%;height:48px;border-radius:var(--r-btn);border:none;background:var(--primary);color:#fff;font-size:15px;font-weight:600;cursor:pointer;transition:all .2s}
.next-btn:disabled{background:#E0E0E0;color:#9E9E9E;cursor:not-allowed}
.next-btn:not(:disabled):active{opacity:.85}

/* PRD System */
.prd-mark{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:50%;background:#1565C0;color:#fff;font-size:10px;font-weight:700;cursor:pointer;flex-shrink:0;user-select:none;box-shadow:0 2px 4px rgba(21,101,194,.3)}
.prd-overlay{position:fixed;inset:0;z-index:900;background:transparent}
.prd-popover{position:fixed;z-index:910;background:#fff;border-radius:14px;box-shadow:0 8px 32px rgba(0,0,0,.18);width:290px;padding:0;overflow:hidden}
.prd-popover-arrow{position:absolute;width:12px;height:12px;background:#fff;transform:rotate(45deg);box-shadow:-2px -2px 5px rgba(0,0,0,.06)}
.prd-pop-head{padding:14px 16px 10px;border-bottom:1px solid #f0f0f0}
.prd-pop-title{font-size:13px;font-weight:700;color:#1A1A1A;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.prd-pop-badge{font-size:10px;padding:2px 7px;border-radius:8px;font-weight:600;background:#FDE8E8;color:#C62828}
.prd-pop-badge.interaction{background:#E8F5E9;color:#2E7D32}
.prd-pop-body{padding:12px 16px}
.prd-pop-body textarea{width:100%;min-height:110px;border:1px solid #e0e0e0;border-radius:8px;padding:9px 10px;font-size:12px;line-height:1.6;color:#424242;resize:vertical;outline:none;background:#fafafa}
.prd-pop-body textarea:focus{border-color:#1565C0;background:#fff}
.prd-pop-foot{padding:10px 16px 14px;display:flex;gap:8px;justify-content:flex-end}
.prd-pop-foot button{padding:7px 16px;border-radius:8px;font-size:13px;font-weight:500;cursor:pointer;border:none}
.prd-btn-cancel{background:#f5f5f5;color:#424242}
.prd-btn-save{background:#1565C0;color:#fff}
</style>
</head>
<body>
<div id="app">
  <div class="app-bar">
    <button class="back-btn" onclick="history.back()"><span class="material-icons">arrow_back</span></button>
    <span class="title">更换手机号</span>
  </div>

  <div class="page-body">

    <!-- 步骤指示器 -->
    <div class="step-container">
      <div class="step-indicator">
        <div class="step-col">
          <div class="step-dot active" id="dot1">1</div>
          <div class="step-label" id="lbl1" style="color:var(--primary)">验证原手机</div>
        </div>
        <div class="step-line" id="stepLine"></div>
        <div class="step-col">
          <div class="step-dot pending" id="dot2">2</div>
          <div class="step-label" id="lbl2" style="color:var(--hint)">绑定新手机</div>
        </div>
      </div>
    </div>

    <!-- Step 1：验证当前手机 -->
    <div id="step1">
      <div class="card">
        <div class="card-title">
          <span>验证安全信息</span>
          <span class="prd-mark" onclick="openPrd(event,1)">1</span>
        </div>
        <div class="card-sub">为保证账号安全，需先验证当前绑定的手机号</div>
        
        <div class="phone-display-box">
          <div class="phone-display-info">
            <span class="material-icons">smartphone</span>
            <span>138 **** 8888</span>
          </div>
        </div>

        <div class="input-group">
          <div class="code-row">
            <div class="input-wrapper">
              <input id="code1" type="tel" maxlength="6" placeholder="请输入短信验证码" oninput="checkStep1()">
            </div>
            <button class="send-btn" id="sendBtn1" onclick="sendCode(1)">获取验证码</button>
          </div>
        </div>

        <button class="next-btn" id="nextBtn1" onclick="verifyStep1()" disabled>下一步</button>
      </div>
    </div>

    <!-- Step 2：绑定新手机 -->
    <div id="step2" style="display:none">
      <div class="card">
        <div class="card-title">
          <span>输入新手机号</span>
          <span class="prd-mark" onclick="openPrd(event,2)">2</span>
        </div>
        <div class="card-sub">更换后，您可以直接使用新手机号登录社区</div>

        <div class="input-group">
          <div class="input-wrapper">
            <input id="newPhone" type="tel" maxlength="13" placeholder="请输入 11 位新手机号" oninput="formatPhone(this);checkStep2()">
            <button class="clear-btn" onclick="clearNewPhone()"><span class="material-icons" style="font-size:18px">cancel</span></button>
          </div>

          <div class="code-row">
            <div class="input-wrapper">
              <input id="code2" type="tel" maxlength="6" placeholder="请输入短信验证码" oninput="checkStep2()">
            </div>
            <button class="send-btn" id="sendBtn2" onclick="sendCode(2)" disabled>获取验证码</button>
          </div>
        </div>

        <button class="next-btn" id="confirmBtn" onclick="confirmChange()" disabled>确认更换</button>
      </div>
    </div>

  </div>
</div>

<script>
function showToast(msg){
  const t=document.createElement('div');
  t.style.cssText='position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.8);color:#fff;padding:9px 18px;border-radius:20px;font-size:13px;z-index:3000;white-space:nowrap;box-shadow:0 4px 12px rgba(0,0,0,.15)';
  t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),2200);
}

let timers={1:null,2:null};

function sendCode(step){
  const btn=document.getElementById('sendBtn'+step);
  btn.disabled=true;
  let sec=60;
  btn.textContent=sec+'s';
  timers[step]=setInterval(()=>{
    sec--;
    if(sec<=0){
      clearInterval(timers[step]);
      timers[step]=null;
      btn.textContent='重新获取';
      if(step===1) btn.disabled=false;
      else checkStep2();
    } else {
      btn.textContent=sec+'s';
    }
  },1000);
  showToast('验证码已发送（1234）');
}

function checkStep1(){
  const code=document.getElementById('code1').value;
  document.getElementById('nextBtn1').disabled=code.length<4;
}

function verifyStep1(){
  const code=document.getElementById('code1').value;
  if(code.length<4){showToast('请输入正确的验证码');return;}
  
  document.getElementById('step1').style.display='none';
  document.getElementById('step2').style.display='block';
  
  document.getElementById('dot1').className='step-dot done';
  document.getElementById('dot1').innerHTML='<span class="material-icons" style="font-size:14px">check</span>';
  document.getElementById('dot2').className='step-dot active';
  document.getElementById('lbl1').style.color='var(--keep)';
  document.getElementById('lbl2').style.color='var(--primary)';
  document.getElementById('stepLine').classList.add('done');
}

function getRawPhone(){
  return document.getElementById('newPhone').value.replace(/\s/g,'');
}

function clearNewPhone(){
  const input = document.getElementById('newPhone');
  input.value = '';
  checkStep2();
  input.focus();
}

function formatPhone(el){
  let v=el.value.replace(/\D/g,'').slice(0,11);
  if(v.length>7) v=v.slice(0,3)+' '+v.slice(3,7)+' '+v.slice(7);
  else if(v.length>3) v=v.slice(0,3)+' '+v.slice(3);
  el.value=v;
}

function checkStep2(){
  const phone=getRawPhone();
  const code=document.getElementById('code2').value;
  const sendBtn=document.getElementById('sendBtn2');
  
  if(!timers[2]){
    sendBtn.disabled = phone.length !== 11;
  }
  document.getElementById('confirmBtn').disabled=!(phone.length===11 && code.length>=4);
}

function confirmChange(){
  const phone=getRawPhone();
  if(phone==='13888888888'){showToast('新手机号不能与当前绑定号码相同');return;}
  if(phone.length!==11){showToast('请输入正确的手机号');return;}
  showToast('手机号更换成功！');
  setTimeout(()=>history.go(-1),1000);
}

/* ─── PRD 标注逻辑保持同步 ─── */
const prdData={
  1:{title:'标记 1 · 原手机校验规范',badge:'交互规范',badgeType:'interaction',
     text:'发送条件：点击即可发送验证码。\n\n倒计时：60s 倒计时，归零后恢复点击。\n\n校验规则：验证码输入 ≥4 位时激活【下一步】按钮。'},
  2:{title:'标记 2 · 新绑定与校验规则',badge:'业务规则',badgeType:'',
     text:'手机号格式：11位数字，自动格式化 3-4-4。\n\n校验规则：\n1. 新号码不能等于原绑定号码（138****8888）。\n2. 手机号满 11 位且验证码 ≥4 位激活【确认更换】。'}
};

function openPrd(e,id){
  e.stopPropagation();closePrd();
  const d=prdData[id];const mark=e.currentTarget;const rect=mark.getBoundingClientRect();
  const overlay=document.createElement('div');overlay.className='prd-overlay';overlay.onclick=closePrd;document.body.appendChild(overlay);
  const pop=document.createElement('div');pop.className='prd-popover';pop.id='prdPop';
  const badgeCls='prd-pop-badge'+(d.badgeType?' '+d.badgeType:'');
  pop.innerHTML=`<div class="prd-pop-head"><div class="prd-pop-title">${d.title}<span class="${badgeCls}">${d.badge}</span></div></div><div class="prd-pop-body"><textarea id="prdTa">${d.text}</textarea></div><div class="prd-pop-foot"><button class="prd-btn-cancel" onclick="closePrd()">取消</button><button class="prd-btn-save" onclick="savePrd(${id})">保存</button></div>`;
  const arrow=document.createElement('div');arrow.className='prd-popover-arrow';pop.appendChild(arrow);document.body.appendChild(pop);
  const popW=290,popH=260;const appRect=document.getElementById('app').getBoundingClientRect();
  let left=Math.min(rect.left-10,appRect.right-popW-8);left=Math.max(appRect.left+8,left);
  let top=rect.bottom+8;
  if(window.innerHeight-rect.bottom < popH) top=rect.top-popH-8;
  pop.style.left=left+'px';pop.style.top=top+'px';
}

function closePrd(){document.querySelector('.prd-overlay')?.remove();document.getElementById('prdPop')?.remove();}
function savePrd(id){
  const ta=document.getElementById('prdTa');if(ta)prdData[id].text=ta.value;
  closePrd();showToast('PRD 规则更新');
}
</script>
<script src="prd-runtime.js"></script>
</body>
</html>
