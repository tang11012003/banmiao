<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>单次大考诊断 - 陪读社区</title>
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--primary:#E6431A;--secondary:#F24B0A;--bg:#F5F5F7;--surface:#FFFFFF;--text1:#1A1A1A;--text2:#424242;--text3:#616161;--hint:#9E9E9E;--divider:#EAEAEA;--urgent:#E53935;--attention:#FBC02D;--keep:#43A047;--orange:#FF6D00;--r-card:14px}
body{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;background:#e8e8e8;color:var(--text1);font-size:14px;line-height:1.5;overflow:hidden;height:100vh;display:flex;align-items:center;justify-content:center}
#app{width:100%;max-width:390px;height:100vh;max-height:844px;background:var(--bg);position:relative;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 0 40px rgba(0,0,0,.15)}
@media(max-width:420px){#app{max-height:100vh;box-shadow:none}}

.app-bar{background:var(--surface);height:52px;display:flex;align-items:center;padding:0 12px;box-shadow:0 .5px 2px rgba(0,0,0,.08);flex-shrink:0;z-index:10}
.app-bar .back-btn{background:none;border:none;color:var(--text1);cursor:pointer;padding:6px;display:flex;align-items:center;border-radius:50%}
.app-bar .back-btn:active{background:#f0f0f0}
.app-bar .page-title{font-size:17px;font-weight:700;color:var(--text1);margin-left:4px;flex:1}

.sub-tab-bar{display:flex;gap:0;overflow-x:auto;background:var(--surface);padding:0 16px;border-bottom:1px solid var(--divider);position:sticky;top:0;z-index:99;-webkit-overflow-scrolling:touch}
.sub-tab-bar::-webkit-scrollbar{display:none}
.sub-tab-item{padding:10px 12px;font-size:12px;font-weight:600;color:var(--text3);white-space:nowrap;cursor:pointer;border-bottom:2px solid transparent;transition:all .15s;flex-shrink:0}
.sub-tab-item.active{color:var(--primary);border-bottom-color:var(--primary)}

.page-body{flex:1;overflow-y:auto;padding:14px 16px;-webkit-overflow-scrolling:touch}
.section-anchor{scroll-margin-top:60px}
.card{background:var(--surface);border-radius:var(--r-card);padding:16px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.filter-picker-btn{display:inline-flex;align-items:center;gap:4px;background:#FFF;border:1px solid var(--divider);padding:5px 12px;border-radius:16px;font-size:12px;font-weight:600;color:var(--text2);cursor:pointer}

.cross-analysis-box{background:linear-gradient(135deg,#FFF9F6 0%,#FFF2ED 100%);border:1px solid rgba(230,67,26,.2);border-radius:12px;padding:12px 14px;margin-top:10px}
.cab-title{font-size:13px;font-weight:700;color:var(--primary);display:flex;align-items:center;gap:4px;margin-bottom:6px}
.cab-desc{font-size:12px;color:var(--text2);line-height:1.6}

.chip-wrap{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.choice-chip{padding:5px 14px;border-radius:16px;font-size:12px;font-weight:500;cursor:pointer;border:1px solid var(--divider);background:#fff;color:var(--text2);transition:all .2s}
.choice-chip.active{background:var(--primary);color:#fff;border-color:var(--primary);font-weight:600}

/* 题型失分 */
.qtype-row{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid #f5f5f5}
.qtype-row:last-child{border-bottom:none}
.qtype-label{width:72px;font-size:13px;font-weight:600;color:var(--text1);flex-shrink:0}
.qtype-bar-wrap{flex:1;display:flex;flex-direction:column;gap:4px}
.qtype-bar-track{height:14px;border-radius:7px;background:#F0F0F0;overflow:hidden;display:flex}
.qtype-bar-got{height:100%;background:var(--keep);border-radius:7px 0 0 7px}
.qtype-bar-lost{height:100%;background:var(--urgent);opacity:.7}
.qtype-meta{display:flex;justify-content:space-between;font-size:11px;color:var(--text3)}
.qtype-score{font-size:12px;font-weight:700;text-align:right;width:60px;flex-shrink:0}

/* 归因 */
.attr-donut-wrap{display:flex;align-items:center;justify-content:center;gap:16px;margin-bottom:16px}
.attr-legend{display:flex;flex-direction:column;gap:8px}
.attr-legend-item{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text2)}
.attr-legend-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.attr-detail-item{padding:12px;background:#fafafa;border-radius:10px;margin-bottom:8px}
.attr-detail-item:last-child{margin-bottom:0}
.attr-detail-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px}
.attr-detail-title{font-size:13px;font-weight:600;color:var(--text1);display:flex;align-items:center;gap:6px}
.attr-detail-score{font-size:13px;font-weight:700}
.attr-detail-desc{font-size:12px;color:var(--text3);line-height:1.5}

/* 难度梯队 */
.diff-item{padding:14px;background:#fafafa;border-radius:12px;margin-bottom:10px}
.diff-item:last-child{margin-bottom:0}
.diff-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.diff-title{font-size:14px;font-weight:700;color:var(--text1);display:flex;align-items:center;gap:6px}
.diff-badge{padding:2px 8px;border-radius:10px;font-size:11px;font-weight:600}
.diff-stats{display:flex;gap:16px;margin-bottom:8px}
.diff-stat{font-size:12px;color:var(--text3)}
.diff-stat strong{color:var(--text1)}
.diff-bar-track{height:8px;border-radius:4px;background:#e8e8e8;overflow:hidden}
.diff-bar-fill{height:100%;border-radius:4px}
.diff-tip{margin-top:8px;font-size:11px;color:var(--text3);display:flex;align-items:center;gap:4px}
.diff-tip .material-icons{font-size:14px;color:var(--primary)}

/* 提分优先级 */
.priority-card{border:1px solid rgba(230,67,26,.15);border-radius:14px;padding:16px;margin-bottom:12px;background:linear-gradient(135deg,#FFFAF8,#FFF5F2)}
.priority-rank{width:28px;height:28px;border-radius:50%;background:var(--primary);color:#fff;font-size:13px;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.priority-header{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.priority-title{font-size:14px;font-weight:700;color:var(--text1)}
.priority-sub{font-size:11px;color:var(--text3);margin-top:2px}
.priority-body{font-size:12px;color:var(--text2);line-height:1.6}
.priority-tag{display:inline-block;padding:2px 8px;border-radius:8px;font-size:11px;font-weight:600;margin-right:6px;margin-bottom:4px}
.priority-action{margin-top:10px;padding:10px 12px;background:rgba(230,67,26,.06);border-radius:8px;font-size:12px;color:var(--primary);font-weight:600;display:flex;align-items:center;gap:4px}
.priority-action .material-icons{font-size:16px}

/* Bottom Sheet */
.sheet-mask{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:100;opacity:0;pointer-events:none;transition:opacity .2s}
.sheet-mask.show{opacity:1;pointer-events:auto}
.sheet-content{position:fixed;bottom:0;left:0;right:0;max-width:390px;margin:0 auto;background:#fff;border-radius:16px 16px 0 0;padding:20px 16px;z-index:101;transform:translateY(100%);transition:transform .25s}
.sheet-mask.show .sheet-content{transform:translateY(0)}
.sheet-title{font-size:16px;font-weight:700;margin-bottom:14px;text-align:center;color:var(--text1)}
.option-item{display:flex;align-items:center;justify-content:space-between;padding:12px;border-radius:10px;background:var(--bg);margin-bottom:8px;cursor:pointer}
.option-item.active{border:1px solid var(--primary);background:rgba(230,67,26,.05);color:var(--primary);font-weight:600}

/* Share Sheet */
.share-mask{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:200;opacity:0;pointer-events:none;transition:opacity .2s}
.share-mask.show{opacity:1;pointer-events:auto}
.share-sheet{position:fixed;bottom:0;left:0;right:0;max-width:390px;margin:0 auto;background:#fff;border-radius:16px 16px 0 0;padding:20px 16px 28px;z-index:201;transform:translateY(100%);transition:transform .25s;max-height:80vh;overflow-y:auto}
.share-mask.show .share-sheet{transform:translateY(0)}
.share-sheet-title{font-size:16px;font-weight:700;text-align:center;color:var(--text1);margin-bottom:14px}
.share-preview{background:var(--bg);border-radius:12px;padding:14px;margin-bottom:16px}
.share-preview .sp-header{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.share-preview .sp-avatar{width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,var(--primary),var(--secondary));color:#fff;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700}
.share-preview .sp-name{font-size:12px;font-weight:600;color:var(--text1)}
.share-preview .sp-tag{font-size:10px;color:var(--text3)}
.share-preview .sp-body{font-size:12px;color:var(--text2);line-height:1.6}
.share-preview .sp-scores{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.share-preview .sp-score-chip{padding:3px 10px;border-radius:8px;font-size:11px;font-weight:600;background:rgba(230,67,26,.08);color:var(--primary)}
.privacy-section{margin-bottom:16px}
.privacy-title{font-size:13px;font-weight:600;color:var(--text1);margin-bottom:10px}
.privacy-row{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid #f5f5f5}
.privacy-row:last-child{border-bottom:none}
.privacy-row .pr-text{font-size:13px;color:var(--text2)}
.privacy-row .pr-sub{font-size:11px;color:var(--hint);margin-top:2px}
.pr-switch{position:relative;width:40px;height:22px;flex-shrink:0}
.pr-switch input{opacity:0;width:0;height:0}
.pr-switch-track{position:absolute;inset:0;border-radius:11px;background:#ccc;transition:background .2s;cursor:pointer}
.pr-switch-track::after{content:'';position:absolute;width:18px;height:18px;border-radius:50%;background:#fff;top:2px;left:2px;transition:transform .2s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.pr-switch input:checked+.pr-switch-track{background:var(--primary)}
.pr-switch input:checked+.pr-switch-track::after{transform:translateX(18px)}
.tag-section{margin-bottom:18px}
.tag-section-title{font-size:13px;font-weight:600;color:var(--text1);margin-bottom:8px}
.tag-chips{display:flex;flex-wrap:wrap;gap:8px}
.tag-chip{padding:6px 12px;border-radius:14px;font-size:12px;font-weight:500;border:1px solid var(--divider);background:#fff;color:var(--text2);cursor:pointer;transition:all .12s}
.tag-chip:active{transform:scale(.96)}
.tag-chip.selected{border-color:var(--primary);background:rgba(230,67,26,.06);color:var(--primary);font-weight:600}
.share-submit-btn{width:100%;padding:14px;border:none;border-radius:var(--r-card);background:var(--primary);color:#fff;font-size:15px;font-weight:700;cursor:pointer;transition:all .12s}
.share-submit-btn:active{transform:scale(.97);opacity:.9}
.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%) translateY(20px);background:rgba(0,0,0,.82);color:#fff;padding:10px 22px;border-radius:22px;font-size:13px;z-index:3000;opacity:0;pointer-events:none;transition:all .25s;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div id="app">
  <div class="app-bar">
    <button class="back-btn" onclick="history.back()"><span class="material-icons">arrow_back</span></button>
    <span class="page-title">单次大考诊断</span>
    <button class="back-btn" onclick="openShareSheet()" style="margin-left:auto"><span class="material-icons">share</span></button>
  </div>
  <div class="sub-tab-bar" id="subTabBar"></div>
  <div class="page-body" id="pageBody"></div>
</div>

<div class="sheet-mask" id="pickerSheet" onclick="closeSheet(event)">
  <div class="sheet-content">
    <div class="sheet-title">选择单次考试</div>
    <div id="pickerOptions"></div>
  </div>
</div>

<div class="share-mask" id="shareMask" onclick="closeShareSheet(event)">
<div class="share-sheet">
  <div class="share-sheet-title">一键分享至社区</div>
  <div class="share-preview" id="sharePreview"></div>
  <div class="privacy-section">
    <div class="privacy-title">隐私脱敏设置</div>
    <div class="privacy-row">
      <div><div class="pr-text">隐藏具体分数</div><div class="pr-sub">分数显示为"优异""良好"等评级</div></div>
      <label class="pr-switch"><input type="checkbox" id="hideScores" checked onchange="updateSharePreview()"><span class="pr-switch-track"></span></label>
    </div>
  </div>
  <div class="tag-section">
    <div class="tag-section-title">选择社区话题</div>
    <div class="tag-chips" id="tagChips">
      <span class="tag-chip selected" onclick="toggleTag(this)">#期中复盘</span>
      <span class="tag-chip" onclick="toggleTag(this)">#薄弱知识点求助</span>
      <span class="tag-chip" onclick="toggleTag(this)">#高三提分</span>
      <span class="tag-chip" onclick="toggleTag(this)">其它</span>
    </div>
  </div>
  <button class="share-submit-btn" onclick="doSharePost()">一键生成帖子并发布</button>
</div>
</div>

<div class="toast" id="toast"></div>

<script>
let activeTab = 'overview';
let selectedExam = '2025-2026学年 期中综合考试';
let selectedSubject = '数学';

const examList = [
  {name:'2025-2026学年 期中综合考试', date:'2026-07-15'},
  {name:'2025-2026学年 10月月考', date:'2026-06-20'},
  {name:'2025-2026学年 9月摸底考试', date:'2026-05-18'}
];

function getExamDate(examName){
  const e=examList.find(x=>x.name===examName);
  return e?e.date:'';
}

function formatExamDateCN(dateStr){
  if(!dateStr)return '';
  const parts=dateStr.split('-');
  return parts[0]+'年'+parseInt(parts[1])+'月'+parseInt(parts[2])+'日';
}

const tabs = [
  {key:'overview', label:'总览'},
  {key:'qtype', label:'题型失分'},
  //{key:'attribution', label:'丢分归因'},
  {key:'difficulty', label:'难度梯队'},
  {key:'priority', label:'提分优先级'}
];

const mockExamsData = {

const qtypeData = {

    {type:'填空题', total:20, got:12, lost:8, totalQ:4, wrongQ:2, desc:'公式运用与逻辑推导'},
    {type:'解答题', total:50, got:34, lost:16, totalQ:5, wrongQ:2, desc:'综合应用与证明'},

  ],

    {type:'解答题', total:36, got:22, lost:14, totalQ:4, wrongQ:2, desc:'受力分析与运动计算'}

const attrData = {
  '数学': {
    total: 50,
    categories: [
      {name:'概念不清', score:14, pct:28, color:'#E53935', icon:'psychology', examples:['二次函数对称轴公式记错','三角恒等变换方向混淆']},

      {name:'审题偏差', score:10, pct:20, color:'#FBC02D', icon:'visibility_off', examples:['题目要求最大值看成最小值','忽略取值范围限制']},
      {name:'解题无思路', score:14, pct:28, color:'#9C27B0', icon:'help_outline', examples:['压轴题函数与数列综合','导数应用于最值证明']}
    ]
  },
  '物理': {
    total: 32,
    categories: [
      {name:'概念不清', score:10, pct:31, color:'#E53935', icon:'psychology', examples:['牛顿第三定律适用条件混淆']},
      {name:'计算失误', score:8, pct:25, color:'#FF6D00', icon:'calculate', examples:['单位换算出错']},
      {name:'审题偏差', score:6, pct:19, color:'#FBC02D', icon:'visibility_off', examples:['漏看"光滑"条件']},
      {name:'解题无思路', score:8, pct:25, color:'#9C27B0', icon:'help_outline', examples:['多体系统受力分析']}
    ]
  }
};

const diffData = {
  '数学': [
    {level:'基础题', label:'简单', total:60, got:52, rate:87, color:'var(--keep)', badge_bg:'rgba(67,160,71,.1)', badge_color:'var(--keep)', tip:'基础题仍有8分失分，主要为计算粗心，可快速补回'},
    {level:'中档题', label:'中等', total:50, got:34, rate:68, color:'var(--attention)', badge_bg:'rgba(251,192,45,.1)', badge_color:'var(--attention)', tip:'中档题是提分性价比最高的区间，建议重点突破'},
    {level:'拔高题', label:'困难', total:40, got:14, rate:35, color:'var(--urgent)', badge_bg:'rgba(229,57,53,.1)', badge_color:'var(--urgent)', tip:'拔高题暂时提升空间有限，建议先稳固中档题后再攻克'}
  ],
  '物理': [
    {level:'基础题', label:'简单', total:40, got:34, rate:85, color:'var(--keep)', badge_bg:'rgba(67,160,71,.1)', badge_color:'var(--keep)', tip:'基础题掌握较好，保持即可'},
    {level:'中档题', label:'中等', total:36, got:22, rate:61, color:'var(--attention)', badge_bg:'rgba(251,192,45,.1)', badge_color:'var(--attention)', tip:'受力分析类中档题失分较多，需重点加强'},
    {level:'拔高题', label:'困难', total:24, got:12, rate:50, color:'var(--urgent)', badge_bg:'rgba(229,57,53,.1)', badge_color:'var(--urgent)', tip:'综合运动计算题需建立系统解题框架'}
  ]
};

const priorityData = {
  '数学': [
    {rank:1, title:'中档解答题 — 二次函数应用', sub:'预计可提12~16分',
      tags:[{text:'中档题',bg:'rgba(251,192,45,.15)',color:'#F57F17'},{text:'概念+思路',bg:'rgba(229,57,53,.1)',color:'var(--urgent)'}],
      reason:'本次中档解答题失分16分，其中二次函数最值、图像变换类题占12分。这类题型出题规律性强，通过针对性训练可在短期内显著提分。',

      reason:'选择题3道错题中2道属于计算失误（符号丢失、分式化简），并非知识点欠缺。这是"最容易拿回来的分"。',

  ],
  '物理': [
    {rank:1, title:'受力分析与牛顿定律应用', sub:'预计可提10~14分',
      tags:[{text:'中档题',bg:'rgba(251,192,45,.15)',color:'#F57F17'},{text:'概念不清',bg:'rgba(229,57,53,.1)',color:'var(--urgent)'}],
      reason:'受力分析类题失分集中，主要是力的分解方向选取不准确和牛顿第二定律列式遗漏力。通过建立标准解题流程可显著改善。',
      action:'使用"隔离体→标力→选坐标→列方程"四步法，每天分析2道受力图'}
  ]
};

function openSheet(){ document.getElementById('pickerSheet').classList.add('show'); }
function closeSheet(e){ if(e.target.classList.contains('sheet-mask')) document.getElementById('pickerSheet').classList.remove('show'); }

function openPicker(){
  document.getElementById('pickerOptions').innerHTML = examList.map(item => `
    <div class="option-item${item.name===selectedExam?' active':''}" onclick="selectExam('${item.name}')">

function drawRadarSVG(subjects, scores) {
  const n = subjects.length; const cx=140, cy=130, r=80;
  const angles = subjects.map((_,i)=>(-Math.PI/2)+(2*Math.PI*i/n));
  let polygonOuter='', polygonData='', labels='', gridLines='';
  // Draw inner grid rings
  [0.25, 0.5, 0.75, 1].forEach(pct=>{
    let ring='';
    angles.forEach(a=>{ ring+=`${cx+r*pct*Math.cos(a)},${cy+r*pct*Math.sin(a)} `; });
    gridLines+=`<polygon points="${ring}" fill="none" stroke="#eee" stroke-width="${pct===1?'1.2':'0.6'}"/>`;
  });
  angles.forEach((a,i)=>{
    const x=cx+r*Math.cos(a), y=cy+r*Math.sin(a);
    const xd=cx+r*(scores[i]/100)*Math.cos(a), yd=cy+r*(scores[i]/100)*Math.sin(a);
    polygonOuter+=`${x},${y} `;
    polygonData+=`${xd},${yd} `;
    // Axis line
    gridLines+=`<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="#eee" stroke-width="0.6"/>`;
    // Label positioning with more offset for score
    const lx=cx+(r+26)*Math.cos(a), ly=cy+(r+26)*Math.sin(a);
    const scoreColor = scores[i]>=80?'#43A047': scores[i]>=65?'#FF6D00':'#E53935';
    labels+=`<text x="${lx}" y="${ly-7}" text-anchor="middle" dominant-baseline="middle" font-size="11" font-weight="700" fill="#424242">${subjects[i]}</text>`;
    labels+=`<text x="${lx}" y="${ly+7}" text-anchor="middle" dominant-baseline="middle" font-size="10" font-weight="700" fill="${scoreColor}">${scores[i]}分</text>`;
  });
  return `<svg viewBox="0 0 280 270" style="width:100%;max-width:280px;display:block;margin:0 auto">${gridLines}<polygon points="${polygonData}" fill="rgba(230,67,26,.12)" stroke="#E6431A" stroke-width="1.8"/>${labels}</svg>`;
}

function drawDonut(categories, total) {
  const size=120, cx=60, cy=60, r=42, inner=28;
  let startAngle=-Math.PI/2, paths='';
  categories.forEach(cat=>{
    const sweep=(cat.pct/100)*2*Math.PI;
    const endAngle=startAngle+sweep;
    const x1=cx+r*Math.cos(startAngle),y1=cy+r*Math.sin(startAngle);
    const x2=cx+r*Math.cos(endAngle),y2=cy+r*Math.sin(endAngle);
    const ix1=cx+inner*Math.cos(endAngle),iy1=cy+inner*Math.sin(endAngle);
    const ix2=cx+inner*Math.cos(startAngle),iy2=cy+inner*Math.sin(startAngle);
    const largeArc=sweep>Math.PI?1:0;
    paths+=`<path d="M${x1},${y1} A${r},${r} 0 ${largeArc} 1 ${x2},${y2} L${ix1},${iy1} A${inner},${inner} 0 ${largeArc} 0 ${ix2},${iy2} Z" fill="${cat.color}" opacity="0.85"/>`;
    startAngle=endAngle;
  });
  return `<svg viewBox="0 0 ${size} ${size}" width="${size}" height="${size}">${paths}<text x="${cx}" y="${cy-4}" text-anchor="middle" font-size="14" font-weight="800" fill="var(--text1)">${total}分</text><text x="${cx}" y="${cy+12}" text-anchor="middle" font-size="10" fill="var(--text3)">总失分</text></svg>`;
}

function render(){
  const pageBody = document.getElementById('pageBody');
  const scrollPos = pageBody.scrollTop;
  document.getElementById('subTabBar').innerHTML = tabs.map(t=>`<div class="sub-tab-item${t.key===activeTab?' active':''}" data-tab="${t.key}" onclick="scrollToSection('${t.key}')">${t.label}</div>`).join('');

  let html = `<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px">
    <span style="font-size:13px;color:var(--text3)">考试场次：</span>
    <div class="filter-picker-btn" onclick="openPicker()"><span>${selectedExam}${getExamDate(selectedExam)?' ('+getExamDate(selectedExam)+')':''}</span><span class="material-icons" style="font-size:16px">arrow_drop_down</span></div>
  </div>`;

  html += `<div id="sec-overview" class="section-anchor">${renderOverview()}</div>`;
  html += `<div id="sec-qtype" class="section-anchor">${renderQtype()}</div>`;
  //html += `<div id="sec-attribution" class="section-anchor">${renderAttribution()}</div>`;
  html += `<div id="sec-difficulty" class="section-anchor">${renderDifficulty()}</div>`;
  html += `<div id="sec-priority" class="section-anchor">${renderPriority()}</div>`;

  pageBody.innerHTML = html;
  pageBody.scrollTop = scrollPos;
}

function scrollToSection(key){
  const el = document.getElementById('sec-'+key);
  if(el){
    isScrolling = true;
    el.scrollIntoView({behavior:'smooth'});
    setActiveTab(key);
    setTimeout(()=>{ isScrolling = false; }, 600);
  }
}

function setActiveTab(key){
  activeTab = key;
  document.querySelectorAll('.sub-tab-item').forEach(t=>{
    t.classList.toggle('active', t.dataset.tab===key);
  });
}

let isScrolling = false;
function initScrollspy(){
  const pageBody = document.getElementById('pageBody');
  const sectionKeys = tabs.map(t=>t.key);
  pageBody.addEventListener('scroll', ()=>{
    if(isScrolling) return;
    const offset = pageBody.scrollTop + 80;
    let current = sectionKeys[0];
    for(const key of sectionKeys){
      const sec = document.getElementById('sec-'+key);
      if(sec && sec.offsetTop <= offset){
        current = key;
      }
    }
    if(current !== activeTab){
      setActiveTab(current);
    }
  });
}

render();
initScrollspy();

function scoreToLevel(score){
  if(score>=85) return '优异';
  if(score>=75) return '良好';
  if(score>=60) return '稳步提升';
  return '需加油';
}
