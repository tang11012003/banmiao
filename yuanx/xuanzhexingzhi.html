<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>选择考试日期 - 陪读社区</title>
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--primary:#E6431A;--secondary:#F24B0A;--bg:#F5F5F7;--surface:#FFFFFF;--text1:#1A1A1A;--text2:#424242;--text3:#616161;--hint:#9E9E9E;--divider:#EAEAEA;--urgent:#E53935;--attention:#FBC02D;--keep:#43A047;--orange:#FF6D00;--r-card:14px;--r-btn:10px}
body{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;background:#e8e8e8;color:var(--text1);font-size:14px;line-height:1.5;overflow:hidden;height:100vh;display:flex;align-items:center;justify-content:center}
#app{width:100%;max-width:390px;height:100vh;max-height:844px;background:var(--bg);position:relative;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 0 40px rgba(0,0,0,.15)}
@media(max-width:420px){#app{max-height:100vh;box-shadow:none}}

.app-bar{background:var(--surface);height:52px;display:flex;align-items:center;padding:0 12px;box-shadow:0 .5px 2px rgba(0,0,0,.08);flex-shrink:0;z-index:10}
.app-bar .back-btn{width:36px;height:36px;display:flex;align-items:center;justify-content:center;cursor:pointer;border-radius:50%;border:none;background:none;color:var(--text2)}
.app-bar .back-btn:active{background:#f0f0f0}
.app-bar .title{font-size:17px;font-weight:600;color:var(--text1);flex:1;margin-left:4px}
.app-bar .step-tag{font-size:11px;color:var(--primary);background:rgba(230,67,26,.08);padding:2px 8px;border-radius:10px;font-weight:600}

.page-body{flex:1;overflow-y:auto;padding:16px;-webkit-overflow-scrolling:touch}

/* 日期选择入口 */
.date-input-card{background:var(--surface);border-radius:var(--r-card);padding:16px;margin-bottom:14px;box-shadow:0 1px 3px rgba(0,0,0,.04);cursor:pointer;display:flex;align-items:center;gap:12px;transition:all .15s;border:1.5px solid var(--divider)}
.date-input-card:active{border-color:var(--primary);background:#FFFAF9}
.date-input-card.selected{border-color:var(--primary)}
.dic-left{flex:1}
.dic-label{font-size:11px;color:var(--text3);font-weight:500;margin-bottom:4px}
.dic-value{font-size:16px;font-weight:700;color:var(--text1);display:flex;align-items:center;gap:6px}
.dic-value.placeholder{color:var(--hint);font-weight:500;font-size:14px}
.dic-value .relative{font-size:12px;color:var(--primary);font-weight:600;background:rgba(230,67,26,.08);padding:1px 6px;border-radius:6px}
.dic-icon{width:40px;height:40px;border-radius:12px;background:rgba(230,67,26,.06);display:flex;align-items:center;justify-content:center}
.dic-icon .material-icons{font-size:22px;color:var(--primary)}

/* 引导占位 */
.guide-card{background:var(--surface);border-radius:var(--r-card);padding:24px 16px;text-align:center;box-shadow:0 1px 3px rgba(0,0,0,.04);margin-bottom:14px}
.guide-card .gc-icon{font-size:40px;color:var(--hint);margin-bottom:10px}
.guide-card .gc-title{font-size:14px;font-weight:600;color:var(--text2);margin-bottom:6px}
.guide-card .gc-desc{font-size:12px;color:var(--text3);line-height:1.5}

/* 行程感知卡片 */
.match-card{border-radius:var(--r-card);padding:14px 16px;margin-bottom:14px;display:flex;align-items:flex-start;gap:12px;animation:fadeSlideIn .3s ease}
.match-card.hit{background:linear-gradient(135deg,#FFF8E1,#FFF3E0);border:1px solid rgba(255,152,0,.35)}
.match-card.miss{background:#F9F9FB;border:1px solid var(--divider)}
.mc-icon{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:2px}
.match-card.hit .mc-icon{background:rgba(255,152,0,.15)}
.match-card.miss .mc-icon{background:rgba(158,158,158,.1)}
.mc-body{flex:1;min-width:0}
.mc-title{font-size:13px;font-weight:600;color:var(--text1)}
.mc-desc{font-size:11px;color:var(--text3);margin-top:3px;line-height:1.4}
.mc-type-tag{display:inline-block;font-size:10px;font-weight:600;padding:2px 8px;border-radius:8px;margin-top:6px}
.mc-type-tag.big{background:rgba(230,67,26,.1);color:var(--primary)}
.mc-type-tag.small{background:rgba(21,101,194,.1);color:#1565C0}

/* 配置区（动态展开） */
.config-area{animation:fadeSlideIn .3s ease}
@keyframes fadeSlideIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}

.section-label{font-size:13px;font-weight:600;color:var(--text2);margin-bottom:8px;display:flex;align-items:center;gap:4px}
.section-label .material-icons{font-size:16px;color:var(--primary)}

.exam-type-row{display:flex;gap:10px;margin-bottom:16px}
.exam-type-card{flex:1;padding:14px 12px;border-radius:14px;border:1.5px solid var(--divider);cursor:pointer;background:#fff;text-align:center;transition:all .15s}
.exam-type-card:active{transform:scale(.97)}
.exam-type-card.active{border-color:var(--primary);background:rgba(230,67,26,.04);box-shadow:0 2px 8px rgba(230,67,26,.08)}
.etc-icon{width:36px;height:36px;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;margin-bottom:6px;background:rgba(158,158,158,.08)}
.exam-type-card.active .etc-icon{background:rgba(230,67,26,.1)}
.etc-icon .material-icons{font-size:20px;color:var(--hint)}
.exam-type-card.active .etc-icon .material-icons{color:var(--primary)}
.etc-title{font-size:13px;font-weight:700;color:var(--text1)}
.etc-desc{font-size:11px;color:var(--text3);margin-top:3px;line-height:1.3}

.name-chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.name-chip{padding:7px 14px;border-radius:16px;font-size:12px;font-weight:500;border:1px solid var(--divider);background:#fff;color:var(--text2);cursor:pointer;transition:all .12s;white-space:nowrap}
.name-chip:active{transform:scale(.96)}
.name-chip.active{border-color:var(--primary);background:rgba(230,67,26,.06);color:var(--primary);font-weight:600}

/* 考试归属 */
.child-section{margin-bottom:16px}
.child-chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.child-chip{padding:8px 16px;border-radius:20px;font-size:13px;font-weight:500;border:1.5px solid var(--divider);background:#fff;color:var(--text2);cursor:pointer;transition:all .15s;display:inline-flex;align-items:center;gap:6px}
.child-chip:active{transform:scale(.96)}
.child-chip.active{border-color:var(--primary);background:rgba(230,67,26,.06);color:var(--primary);font-weight:600}
.child-chip .material-icons{font-size:16px}
.child-hint{font-size:12px;color:var(--hint);margin-top:6px;display:flex;align-items:center;gap:4px}
.child-hint .material-icons{font-size:14px;color:var(--attention)}
.child-auto-tag{font-size:10px;color:var(--primary);background:rgba(230,67,26,.08);padding:2px 6px;border-radius:6px;font-weight:600;margin-left:4px}
.input-field{width:100%;padding:11px 14px;border:1px solid #e0e0e0;border-radius:var(--r-btn);font-size:14px;background:#fafafa;outline:none;transition:border .2s}
.input-field:focus{border-color:var(--primary)}

/* 主按钮 */
.next-btn{width:100%;padding:14px;border-radius:12px;border:none;background:var(--primary);color:#fff;font-size:15px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;margin-top:20px;transition:all .15s}
.next-btn:active{transform:scale(.98);opacity:.9}
.next-btn:disabled{opacity:.35;cursor:not-allowed;transform:none;background:#bbb}
.next-btn .material-icons{font-size:18px}

/* Bottom Sheet */
.sheet-overlay{position:absolute;inset:0;background:rgba(0,0,0,.45);z-index:100;opacity:0;pointer-events:none;transition:opacity .25s ease}
.sheet-overlay.show{opacity:1;pointer-events:auto}
.sheet-panel{position:absolute;bottom:0;left:0;right:0;background:var(--surface);border-radius:20px 20px 0 0;padding:12px 16px 28px;z-index:101;transform:translateY(100%);transition:transform .3s cubic-bezier(.4,0,.2,1);max-height:65vh;overflow-y:auto}
.sheet-panel.show{transform:translateY(0)}
.sheet-handle{width:36px;height:4px;border-radius:2px;background:#ddd;margin:0 auto 14px}

/* 日历 */
.cal-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.cal-nav button{background:none;border:none;cursor:pointer;padding:6px;border-radius:50%;color:var(--text2);display:flex;align-items:center}
.cal-nav button:active{background:#f0f0f0}
.cal-nav .month-label{font-size:15px;font-weight:700}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}
.cal-header{font-size:11px;color:var(--hint);padding:6px 0;font-weight:500}
.cal-day{padding:6px 2px;border-radius:8px;cursor:pointer;min-height:42px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;transition:background .12s}
.cal-day:active{background:#f0f0f0}
.cal-day.today .day-num{color:var(--primary);font-weight:700}
.cal-day.selected{background:var(--primary)}
.cal-day.selected .day-num{color:#fff;font-weight:700}
.cal-day.selected .dot{background:#fff!important}
.cal-day .day-num{font-size:13px;font-weight:500;margin-bottom:2px;color:var(--text1)}
.cal-day .dots{display:flex;gap:2px;margin-top:2px}
.cal-day .dot{width:5px;height:5px;border-radius:50%}
.cal-day.other-month{pointer-events:none}
.cal-day.other-month .day-num{color:var(--hint)}

/* ── PRD 标注系统 ── */
.prd-mark{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:50%;background:#1565C0;color:#fff;font-size:11px;font-weight:700;cursor:pointer;flex-shrink:0;transition:transform .12s;user-select:none;vertical-align:middle;margin-left:6px;box-shadow:0 2px 6px rgba(21,101,194,.4);position:relative;z-index:5}
.prd-mark:active{transform:scale(.85)}
.prd-overlay{position:fixed;inset:0;z-index:900;background:transparent}
.prd-popover{position:fixed;z-index:910;background:#fff;border-radius:14px;box-shadow:0 8px 32px rgba(0,0,0,.18);width:290px;padding:0;overflow:hidden}
.prd-popover-arrow{position:absolute;width:12px;height:12px;background:#fff;transform:rotate(45deg);box-shadow:-2px -2px 5px rgba(0,0,0,.06)}
.prd-pop-head{padding:14px 16px 10px;border-bottom:1px solid #f0f0f0}
.prd-pop-title{font-size:13px;font-weight:700;color:#1A1A1A;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.prd-pop-badge{font-size:10px;padding:2px 7px;border-radius:8px;font-weight:600;background:#FDE8E8;color:#C62828}
.prd-pop-badge.interaction{background:#E8F5E9;color:#2E7D32}
.prd-pop-badge.data{background:#E3F2FD;color:#1565C0}
.prd-pop-body{padding:12px 16px}
.prd-pop-body textarea{width:100%;min-height:110px;border:1px solid #e0e0e0;border-radius:8px;padding:9px 10px;font-size:12px;line-height:1.6;color:#424242;font-family:-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif;resize:vertical;outline:none;background:#fafafa;transition:border .15s}
.prd-pop-body textarea:focus{border-color:#1565C0;background:#fff}
.prd-pop-foot{padding:10px 16px 14px;display:flex;gap:8px;justify-content:flex-end}
.prd-pop-foot button{padding:7px 16px;border-radius:8px;font-size:13px;font-weight:500;cursor:pointer;border:none}
.prd-btn-cancel{background:#f5f5f5;color:#424242}
.prd-btn-save{background:#1565C0;color:#fff}
</style>
</head>
<body>
<div id="app">
<div class="app-bar">
<button class="back-btn" onclick="history.back()"><span class="material-icons">arrow_back</span></button>
<span class="title">上传试卷</span>
<span class="step-tag">步骤 1/2</span><span class="prd-mark" onclick="openPrd(event,1)" style="margin-left:8px">1</span>
</div>
<div class="page-body" id="pageBody"></div>

<div class="sheet-overlay" id="sheetOverlay" onclick="closeSheet()"></div>
<div class="sheet-panel" id="sheetPanel">
<div class="sheet-handle"></div>
<div id="calendarContainer"></div>
</div>
</div>

<script>
const today=new Date();
let focusedYear=today.getFullYear(),focusedMonth=today.getMonth();
let selectedDate=null;

const typeColors={mock_exam:'#FF6D00',gaokao:'#E53935',registration:'#1565C0',custom:'#9C27B0'};

const childList=[{id:'1',name:'张小明'},{id:'2',name:'张小红'}];

const mockEvents=[
  {title:'期中综合考试',date:fmtD(offsetDate(-1)),type:'mock_exam',examType:'big',child:'1'},
  {title:'数学专项模考',date:fmtD(offsetDate(-5)),type:'mock_exam',examType:'small',child:'2'},
  {title:'英语周测',date:fmtD(offsetDate(-8)),type:'mock_exam',examType:'small'},
  {title:'月考',date:fmtD(offsetDate(3)),type:'mock_exam',examType:'big',child:'1'},
  {title:'化学单元测试',date:fmtD(offsetDate(7)),type:'mock_exam',examType:'small'}
];

function offsetDate(n){const d=new Date();d.setDate(d.getDate()+n);return d}
function fmtD(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function getEventsForDate(d){return mockEvents.filter(e=>e.date===fmtD(d))}

let examType='big';
let selectedChipName='';
let matchedEvent=null;
let selectedChild='';

const bigNames=['期中考试','期末考试','一模','二模','月考','模拟考试'];
const smallNames=['周测','单元测试','随堂小测','课后测验'];

function getRelativeLabel(d){
  const diff=Math.round((today-d)/(1000*60*60*24));
  if(diff===0)return '今天';
  if(diff===1)return '昨天';
  if(diff===-1)return '明天';
  if(diff>1&&diff<=7)return `${diff}天前`;
  if(diff<-1&&diff>=-7)return `${-diff}天后`;
  return '';
}

function formatDateDisplay(d){
  const weekDays=['日','一','二','三','四','五','六'];
  return `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日 周${weekDays[d.getDay()]}`;
}

function getChildName(id){const c=childList.find(x=>x.id===id);return c?c.name:'';}

function renderChildSection(autoFromEvent){
  const isAuto=autoFromEvent&&selectedChild;
  let html='<div class="child-section">';
  html+='<div class="section-label"><span class="material-icons">face</span>考试归属</div><span class="prd-mark" onclick="openPrd(event,4)" style="display:inline-flex;margin-left:4px">4</span>';
  html+='<div class="child-chips">';
  childList.forEach(c=>{
    const active=selectedChild===c.id?' active':'';
    html+=`<div class="child-chip${active}" onclick="pickChild('${c.id}')"><span class="material-icons">${selectedChild===c.id?'check_circle':'person'}</span>${c.name}${isAuto&&selectedChild===c.id?'<span class="child-auto-tag"></span>':''}</div>`;
  });
  html+='</div>';
  if(!selectedChild){
    html+='<div class="child-hint"><span class="material-icons">info</span>请选择该考试归属的孩子</div>';
  }
  html+='</div>';
  return html;
}

function renderPage(){
  matchedEvent=selectedDate?getEventsForDate(selectedDate)[0]||null:null;

  if(matchedEvent){
    examType=matchedEvent.examType||'big';
    selectedChipName=matchedEvent.title;
    if(matchedEvent.child&&!selectedChild)selectedChild=matchedEvent.child;
  }

  const body=document.getElementById('pageBody');
  let html='';

  // 日期入口卡片
  if(selectedDate){
    const relLabel=getRelativeLabel(selectedDate);
    html+=`
    <div class="date-input-card selected" onclick="openSheet()">
      <div class="dic-left">
        <div class="dic-label">考试日期</div>
        <div class="dic-value">
          ${formatDateDisplay(selectedDate)}
          ${relLabel?`<span class="relative">${relLabel}</span>`:''}
        </div>
      </div>
      <div class="dic-icon"><span class="material-icons">calendar_month</span></div>
    </div>`;
  }else{
    html+=`
    <div class="date-input-card" onclick="openSheet()">
      <div class="dic-left">
        <div class="dic-label">考试日期</div>
        <div class="dic-value placeholder">请选择考试日期</div>
      </div>
      <div class="dic-icon"><span class="material-icons">calendar_month</span></div>
    </div>`;
  }

  // 未选日期：引导态
  if(!selectedDate){
    html+=`
    <div class="guide-card">
      <div class="gc-icon"><span class="material-icons" style="font-size:40px">touch_app</span></div>
      <div class="gc-title">请先选择考试日期</div>
      <div class="gc-desc">系统将自动为您匹配已有日程，或帮您新建复盘行程</div>
    </div>
    <button class="next-btn" disabled>请先选择日期</button>`;
    body.innerHTML=html;
    return;
  }

  // 已选日期：命中行程
  if(matchedEvent){
    html+=`
    <div class="match-card hit">
      <div class="mc-icon"><span class="material-icons" style="color:#FF9800;font-size:20px">event_available</span></div>
      <div class="mc-body">
        <div class="mc-title">已匹配日历行程：${matchedEvent.title}</div>
        <div class="mc-desc">${fmtD(selectedDate)} · 系统已自动预选考试模式（可修改）</div>
        <span class="mc-type-tag ${matchedEvent.examType}">${matchedEvent.examType==='big'?'大考·全科':'小考·单科'}</span>
      </div>
    </div>
    <div class="config-area">
      <div class="section-label"><span class="material-icons">category</span>考试模式</div><span class="prd-mark" onclick="openPrd(event,2)" style="display:inline-flex;margin-left:4px">2</span>
      <div class="exam-type-row">
        <div class="exam-type-card${examType==='big'?' active':''}" onclick="pickType('big')">
          <div class="etc-icon"><span class="material-icons">school</span></div>
          <div class="etc-title">大考（全科）</div>
          <div class="etc-desc">期中、期末、模考等多科连拍</div>
        </div>
        <div class="exam-type-card${examType==='small'?' active':''}" onclick="pickType('small')">
          <div class="etc-icon"><span class="material-icons">assignment</span></div>
          <div class="etc-title">小考（单科）</div>
          <div class="etc-desc">周测、单元考、随堂小测</div>
        </div>
      </div>
      ${renderChildSection(true)}
      <button class="next-btn" onclick="goNext()">
        下一步：去拍照 <span class="material-icons">arrow_forward</span><span class="prd-mark" onclick="openPrd(event,3)" style="margin-left:8px">3</span>
      </button>
    </div>`;
  }else{
    // 未命中行程
    html+=`
    <div class="match-card miss">
      <div class="mc-icon"><span class="material-icons" style="color:var(--hint);font-size:20px">event_busy</span></div>
      <div class="mc-body">
        <div class="mc-title">当前日期无行程</div>
        <div class="mc-desc">提交后将自动在日历新建此复盘日程</div>
      </div>
    </div>
    <div class="config-area">
      <div class="section-label"><span class="material-icons">category</span>考试模式</div><span class="prd-mark" onclick="openPrd(event,2)" style="display:inline-flex;margin-left:4px">2</span>
      <div class="exam-type-row">
        <div class="exam-type-card${examType==='big'?' active':''}" onclick="pickType('big')">
          <div class="etc-icon"><span class="material-icons">school</span></div>
          <div class="etc-title">大考（全科）</div>
          <div class="etc-desc">期中、期末、模考等多科连拍</div>
        </div>
        <div class="exam-type-card${examType==='small'?' active':''}" onclick="pickType('small')">
          <div class="etc-icon"><span class="material-icons">assignment</span></div>
          <div class="etc-title">小考（单科）</div>
          <div class="etc-desc">周测、单元考、随堂小测</div>
        </div>
      </div>

      <div class="section-label"><span class="material-icons">edit</span>考试名称</div>
      <input class="input-field" id="nameInput" placeholder="请输入考试名称，如：期中考试、月考" value="${selectedChipName}" oninput="onNameInput()">

      ${renderChildSection(false)}
      <button class="next-btn" onclick="goNext()">
        下一步：去拍照 <span class="material-icons">arrow_forward</span><span class="prd-mark" onclick="openPrd(event,3)" style="margin-left:8px">3</span>
      </button>
    </div>`;
  }

  body.innerHTML=html;
}

// Bottom Sheet
function openSheet(){
  focusedYear=selectedDate?selectedDate.getFullYear():today.getFullYear();
  focusedMonth=selectedDate?selectedDate.getMonth():today.getMonth();
  renderCalendar();
  document.getElementById('sheetOverlay').classList.add('show');
  document.getElementById('sheetPanel').classList.add('show');
}

function closeSheet(){
  document.getElementById('sheetOverlay').classList.remove('show');
  document.getElementById('sheetPanel').classList.remove('show');
}

function renderCalendar(){
  const firstDay=new Date(focusedYear,focusedMonth,1);
  const lastDay=new Date(focusedYear,focusedMonth+1,0);
  let startDow=firstDay.getDay();if(startDow===0)startDow=7;startDow--;
  const daysInMonth=lastDay.getDate();
  const prevMonth=new Date(focusedYear,focusedMonth,0);
  const prevDays=prevMonth.getDate();

  let html=`
  <div class="cal-nav">
    <button onclick="changeMonth(-1)"><span class="material-icons">chevron_left</span></button>
    <span class="month-label">${focusedYear}年${focusedMonth+1}月</span>
    <button onclick="changeMonth(1)"><span class="material-icons">chevron_right</span></button>
  </div>
  <div class="cal-grid">
    <div class="cal-header">一</div><div class="cal-header">二</div><div class="cal-header">三</div>
    <div class="cal-header">四</div><div class="cal-header">五</div><div class="cal-header">六</div><div class="cal-header">日</div>`;

  for(let i=startDow-1;i>=0;i--){
    html+=`<div class="cal-day other-month"><span class="day-num">${prevDays-i}</span></div>`;
  }
  for(let d=1;d<=daysInMonth;d++){
    const date=new Date(focusedYear,focusedMonth,d);
    const isToday=date.toDateString()===today.toDateString();
    const isSelected=selectedDate&&date.toDateString()===selectedDate.toDateString();
    const evts=getEventsForDate(date);
    let dotsHtml='';
    if(evts.length>0){
      dotsHtml=`<div class="dots">${evts.slice(0,3).map(e=>`<span class="dot" style="background:${typeColors[e.type]||'#9E9E9E'}"></span>`).join('')}</div>`;
    }
    const cls=['cal-day'];
    if(isToday)cls.push('today');
    if(isSelected)cls.push('selected');
    html+=`<div class="${cls.join(' ')}" onclick="selectDay(${d})"><span class="day-num">${d}</span>${dotsHtml}</div>`;
  }
  const totalCells=startDow+daysInMonth;
  const remaining=totalCells%7===0?0:7-totalCells%7;
  for(let i=1;i<=remaining;i++){
    html+=`<div class="cal-day other-month"><span class="day-num">${i}</span></div>`;
  }
  html+=`</div>`;
  document.getElementById('calendarContainer').innerHTML=html;
}

function changeMonth(dir){
  focusedMonth+=dir;
  if(focusedMonth<0){focusedMonth=11;focusedYear--;}
  if(focusedMonth>11){focusedMonth=0;focusedYear++;}
  renderCalendar();
}

function selectDay(d){
  selectedDate=new Date(focusedYear,focusedMonth,d);
  selectedChipName='';
  examType='big';
  selectedChild='';
  closeSheet();
  setTimeout(renderPage,150);
}

function pickType(t){
  examType=t;
  selectedChipName='';
  renderPage();
}

function pickChip(name){
  if(selectedChipName===name){selectedChipName='';}
  else{selectedChipName=name;}
  renderPage();
}

function pickChild(id){
  selectedChild=selectedChild===id?'':id;
  renderPage();
}

function onNameInput(){
  selectedChipName='';
  document.querySelectorAll('.name-chip').forEach(c=>c.classList.remove('active'));
}

function goNext(){
  if(!selectedDate)return;
  let finalName='';
  if(matchedEvent){
    finalName=matchedEvent.title;
  }else{
    const nameInput=document.getElementById('nameInput');
    finalName=(nameInput?nameInput.value.trim():'')||selectedChipName||'未命名考试';
  }

  const ctx={
    examDate:fmtD(selectedDate),
    examName:finalName,
    examType:examType,
    childId:selectedChild||'',
    childName:getChildName(selectedChild),
    createCalendarEvent:!matchedEvent,
    createdAt:Date.now()
  };
  localStorage.setItem('uploadStep1',JSON.stringify(ctx));
  window.location.href='shangchuanfupan.html';
}

renderPage();

function showToast(msg){const t=document.createElement('div');t.style.cssText='position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.78);color:#fff;padding:9px 20px;border-radius:20px;font-size:13px;z-index:3000;white-space:nowrap';t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),2000)}
</script>
<script src="prd-runtime.js"></script>
